<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>sky-ar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #14161a;
      --panel: #1e2126;
      --line: #2c3038;
      --text: #e8eaed;
      --muted: #8b939e;
      --accent: #4a9eff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
      padding: 1.5rem 1rem calc(3rem + env(safe-area-inset-bottom));
    }
    main { max-width: 44rem; margin: 0 auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr));
      gap: .75rem;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .card img { display: block; width: 100%; height: auto; }
    .card span {
      display: block;
      padding: .4rem .5rem .5rem;
      font-size: .6875rem;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Fill the viewport minus body padding so the card sits centred.
         dvh tracks the collapsing browser chrome on mobile; vh is the
         fallback for engines that do not know it. */
      min-height: calc(100vh - 4.5rem - env(safe-area-inset-bottom));
      min-height: calc(100dvh - 4.5rem - env(safe-area-inset-bottom));
    }
    .detail img.hero {
      display: block;
      width: 100%;
      max-width: 20rem;
      margin: 0 auto 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .launch {
      display: inline-block;
      padding: .875rem 2rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
    }
    .launch img { display: none; }
    .note {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: .8125rem;
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="./cards.js"></script>
  <script src="./app.js"></script>
</body>
</html>
