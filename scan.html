<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>sky-ar scan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #14161a;
      --text: #e8eaed;
      --muted: #8b939e;
      --accent: #4a9eff;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Card-shaped hole; the huge shadow darkens everything outside it. */
    #guide {
      position: fixed;
      left: 50%;
      top: 45%;
      width: min(78vw, 62vh * 0.7);
      aspect-ratio: 830 / 1185;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, .85);
      border-radius: 12px;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55);
    }
    #guide.hit { border-color: var(--accent); }
    #panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      text-align: center;
    }
    #status { font-size: .9375rem; }
    #debug { margin-top: .25rem; font-size: .75rem; color: var(--muted); font-family: ui-monospace, monospace; }
    button {
      margin-top: .75rem;
      padding: .875rem 2rem;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 999px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="video" playsinline muted></video>
  <div id="guide"></div>
  <div id="panel">
    <p id="status">読み込み中…</p>
    <p id="debug" hidden></p>
    <button id="start" type="button" hidden>スキャン開始</button>
  </div>
  <script src="./cards.js"></script>
  <script src="./ar.js"></script>
  <script src="./scan.js"></script>
</body>
</html>
